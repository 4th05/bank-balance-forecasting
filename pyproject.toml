[project]
name = "bank-balance_forecasting"
version = "0.1.0"
description = "A notebook study of daily bank-account balance forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.11.2,<4",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "plotly>=5.24,<6",
    "polars>=1.44,<2",
    "pyarrow>=20",
    "pyyaml>=6,<7",
    "scikit-learn>=1.9.1,<2",
    "scipy>=1.18.1,<2",
    "threadpoolctl>=3,<4",
    "ts2vg>=1.2.5,<2",
    "tsfresh>=0.21.2,<1",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting==2.3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_balance_forecasting"]
